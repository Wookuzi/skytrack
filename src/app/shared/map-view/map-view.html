  <!-- Kompas: smer izbranega leta -->
  <div class="compass" aria-hidden="true">
    <span class="compass-n">S</span>
    <span class="needle" style="--heading: 208deg"></span>
    <span class="compass-value">JJZ</span>
  </div>

  <!-- Upravljanje zemljevida (v tej vaji brez delovanja) -->

    <button mat-icon-button type="button" aria-label="Povečaj"><fa-icon [icon]="faPlus" /></button>
    <button mat-icon-button type="button" aria-label="Pomanjšaj"><fa-icon [icon]="faMinus" /></button>
    <button mat-icon-button type="button" aria-label="Moja lokacija"><fa-icon [icon]="faLocationCrosshairs" /></button>
  </div>

  <div class="overlay"><ng-content select="[mapOverlay]" /></div>

  <p class="legend">Podatki: OpenSky Network · osveženo pred 10 s</p>
