<div class="bar" role="search">

    <mat-label>{{ label() }}</mat-label>
    <fa-icon matPrefix class="prefix" [icon]="faMagnifyingGlass" />

  </mat-form-field>
  <div class="filters"><ng-content /></div>
</div>
