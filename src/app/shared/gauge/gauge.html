<div class="gauge" role="img" [attr.aria-label]="label() + ': ' + display() + ' ' + unit()">
  <svg class="arc" viewBox="0 0 100 56" aria-hidden="true">
    <path class="track" d="M8 50 A42 42 0 0 1 92 50" pathLength="100" />
    <path class="fill" d="M8 50 A42 42 0 0 1 92 50" pathLength="100" [attr.stroke-dasharray]="percent() + ' 100'" />
  </svg>
  <div class="readout">
    <span class="value">{{ display() }}</span>
    <span class="unit">{{ unit() }}</span>
  </div>
  <div class="label">{{ label() }}</div>
</div>
