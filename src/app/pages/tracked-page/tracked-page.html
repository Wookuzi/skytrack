<div class="page">
  <app-page-title
    heading="Sledena letala"
    subtitle="Letala, ki jim slediš, in tvoji zapiski"
    [icon]="faStar"
  />

  <mat-tab-group>
    <mat-tab label="Sledena (3)">
      <div class="card-grid tab-body">
        <app-flight-card icao24="06a0be" callsign="QTR34E" country="Katar" [altitude]="10058" [speed]="1020" [heading]="128" note="A350, lep!" />
        <app-flight-card icao24="501d21" callsign="CTN436R" country="Hrvaška" [altitude]="2446" [speed]="485" [heading]="312" status="Pristaja" tone="warn" />
        <app-flight-card icao24="39de4c" callsign="TVF44AG" country="Francija" [altitude]="11270" [speed]="921" [heading]="128" note="Vsak dan ob tej uri nad Ljubljano." />
      </div>
    </mat-tab>
    <mat-tab label="Zapiski (2)">
      <div class="notes tab-body">
        <app-message-card heading="QTR34E · Katar" meta="Dodano 9. 11. 2026" [icon]="faNoteSticky">
          A350, lep!
        </app-message-card>
        <app-message-card heading="TVF44AG · Francija" meta="Dodano 10. 11. 2026" [icon]="faNoteSticky">
          Vsak dan ob tej uri nad Ljubljano.
        </app-message-card>
      </div>
    </mat-tab>
    <mat-tab label="Opozorila (0)">
      <app-empty-state
        heading="Ni vklopljenih opozoril"
        text="Ko pri sledenem letalu vklopiš opozorilo, boš tukaj videl, kdaj je vzletelo ali pristalo."
        [icon]="faBell"
      >
        <a mat-button routerLink="/">Na radar</a>
      </app-empty-state>
    </mat-tab>
  </mat-tab-group>
</div>
