<div class="page">
  <app-page-title
    heading="Sledena letala"
    subtitle="Letala, ki jim slediš, in tvoji zapiski"
    [icon]="faStar"
  />

  <mat-tab-group>
    <mat-tab label="Sledena (3)">
      <div class="card-grid tab-body">
        <app-flight-card icao24="06a0be" callsign="QTR34E" country="Katar" [altitude]="10058" [speed]="1020" [heading]="128" note="A350, lep!" />
        <app-flight-card icao24="501d21" callsign="CTN436R" country="Hrvaška" [altitude]="2446" [speed]="485" [heading]="312" status="Pristaja" />
        <app-flight-card icao24="39de4c" callsign="TVF44AG" country="Francija" [altitude]="11270" [speed]="921" [heading]="128" note="Vsak dan ob tej uri nad Ljubljano." />
      </div>
    </mat-tab>
    <mat-tab label="Zapiski">
      <div class="notes tab-body">
        <mat-card appearance="outlined">
          <mat-card-header>
            <mat-card-title>QTR34E</mat-card-title>
            <mat-card-subtitle>Dodano 9. 11. 2026</mat-card-subtitle>
          </mat-card-header>
          <mat-card-content class="note-text">A350, lep!</mat-card-content>
        </mat-card>
        <mat-card appearance="outlined">
          <mat-card-header>
            <mat-card-title>TVF44AG</mat-card-title>
            <mat-card-subtitle>Dodano 10. 11. 2026</mat-card-subtitle>
          </mat-card-header>
          <mat-card-content class="note-text">Vsak dan ob tej uri nad Ljubljano.</mat-card-content>
        </mat-card>
      </div>
    </mat-tab>
  </mat-tab-group>
</div>
