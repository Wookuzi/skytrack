<div class="page">
  <app-page-title
    heading="Radar v živo"
    subtitle="Sreda, 11. 11. 2026 · Slovenija in okolica · osveženo pred 10 s"
    [icon]="faMapLocationDot"
  >
    <button mat-stroked-button type="button">
      <fa-icon class="button-icon" [icon]="faRoute" />Pokaži poti
    </button>
  </app-page-title>

  <app-search-filter-bar label="Išči klicni znak" placeholder="npr. RYR5PC">
    <mat-chip-listbox aria-label="Filtri letov" hideSingleSelectionIndicator>
      <mat-chip-option selected>Vsi · 24</mat-chip-option>
      <mat-chip-option>V zraku · 22</mat-chip-option>
      <mat-chip-option>Na tleh · 2</mat-chip-option>
      <mat-chip-option>Nad 10 km · 15</mat-chip-option>
      <mat-chip-option>Sledena · 3</mat-chip-option>
    </mat-chip-listbox>
  </app-search-filter-bar>

  <div class="radar">
    <app-map-view class="map">
      <!-- Lebdeča kartica izbranega leta -->
      <mat-card mapOverlay appearance="outlined" class="selected">
        <div class="selected-head">
          <span class="selected-icon" aria-hidden="true"><fa-icon [icon]="faPlane" style="rotate: 118deg" /></span>
          <div class="selected-name">
            <strong>RYR5PC</strong>
            <span>Ryanair · Poljska</span>
          </div>
          <mat-chip-set aria-label="Stanje leta">
            <mat-chip class="status-active">Izbrano</mat-chip>
          </mat-chip-set>
        </div>
        <div class="gauges">
          <app-gauge label="Hitrost" [value]="805" [max]="1100" display="805" unit="km/h" />
          <app-gauge label="Višina" [value]="11582" [max]="13000" display="11.582" unit="m" />
        </div>
        <a mat-flat-button class="selected-link" [routerLink]="['/let', '48c2b0']">
          Podrobnosti leta<fa-icon class="arrow" [icon]="faArrowRight" />
        </a>
      </mat-card>
    </app-map-view>

    <section class="side" aria-labelledby="flights-title">
      <div class="stat-grid stats">
        <app-stat-tile label="Letal na zemljevidu" value="24" [icon]="faPlane" />
        <app-stat-tile label="Sledenih" value="3" [icon]="faStar" />
        <app-stat-tile label="Največja hitrost" value="1.020" unit="km/h" [icon]="faGaugeHigh" />
      </div>

      <h2 id="flights-title" class="section-title">Leti v bližini</h2>
      <div class="flights">
        <app-flight-card icao24="48c2b0" callsign="RYR5PC" country="Poljska" [altitude]="11582" [speed]="805" [heading]="208" />
        <app-flight-card icao24="4bb273" callsign="THY72B" country="Turčija" [altitude]="10371" [speed]="690" [heading]="299" />
        <app-flight-card icao24="06a0be" callsign="QTR34E" country="Katar" [altitude]="10058" [speed]="1020" [heading]="128" />
        <app-flight-card icao24="501d21" callsign="CTN436R" country="Hrvaška" [altitude]="2446" [speed]="485" [heading]="312" status="Pristaja" tone="warn" />
        <app-flight-card icao24="39de4c" callsign="TVF44AG" country="Francija" [altitude]="11270" [speed]="921" [heading]="128" />
        <app-flight-card icao24="471d6c" callsign="WMT4WE" country="Madžarska" [altitude]="10973" [speed]="931" [heading]="76" />
      </div>
    </section>
  </div>
</div>
