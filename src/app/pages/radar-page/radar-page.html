<div class="page">
  <app-page-title
    heading="Radar v živo"
    subtitle="Letala nad Slovenijo in okolico"
    [icon]="faMapLocationDot"
  />

  <app-search-filter-bar label="Išči klicni znak" placeholder="npr. RYR5PC">
    <mat-chip-listbox aria-label="Filtri letov" multiple>
      <mat-chip-option selected>V zraku</mat-chip-option>
      <mat-chip-option>Na tleh</mat-chip-option>
      <mat-chip-option>Nad 10 km</mat-chip-option>
      <mat-chip-option>Samo sledena</mat-chip-option>
    </mat-chip-listbox>
  </app-search-filter-bar>

  <div class="radar">
    <app-map-view class="map" />

    <section class="side" aria-labelledby="flights-title">
      <div class="stat-grid stats">
        <app-stat-tile label="Letal na zemljevidu" value="24" [icon]="faPlane" />
        <app-stat-tile label="Sledenih" value="3" [icon]="faStar" />
        <app-stat-tile label="Največja hitrost" value="1.020" unit="km/h" [icon]="faGaugeHigh" />
      </div>

      <h2 id="flights-title" class="section-title">Leti</h2>
      <div class="flights">
        <app-flight-card icao24="48c2b0" callsign="RYR5PC" country="Poljska" [altitude]="11582" [speed]="805" [heading]="208" />
        <app-flight-card icao24="4bb273" callsign="THY72B" country="Turčija" [altitude]="10371" [speed]="690" [heading]="299" />
        <app-flight-card icao24="06a0be" callsign="QTR34E" country="Katar" [altitude]="10058" [speed]="1020" [heading]="128" />
        <app-flight-card icao24="501d21" callsign="CTN436R" country="Hrvaška" [altitude]="2446" [speed]="485" [heading]="312" status="Pristaja" />
        <app-flight-card icao24="39de4c" callsign="TVF44AG" country="Francija" [altitude]="11270" [speed]="921" [heading]="128" />
        <app-flight-card icao24="471d6c" callsign="WMT4WE" country="Madžarska" [altitude]="10973" [speed]="931" [heading]="76" />
      </div>
    </section>
  </div>
</div>
